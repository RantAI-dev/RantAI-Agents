appId: ai.rantai.mobile
---
- launchApp
- assertVisible: "Sign in"
- tapOn: "Email"
- inputText: "test@example.com"
- tapOn: "Password"
- inputText: "test-password"
- tapOn: "Sign in"
- assertVisible: "Chat"
- tapOn:
    id: "New chat"
- assertVisible: "Pick an assistant"
- tapOn:
    index: 0
- assertVisible: "Message"
- tapOn:
    id: "Message input"
- inputText: "Hello"
- tapOn:
    id: "Send"
- waitForAnimationToEnd:
    timeout: 30000
- assertVisible: "Hello"
