[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
agents-core = { path = "crates/agents-core" }
agents-contracts = { path = "crates/agents-contracts" }
agents-auth = { path = "crates/agents-auth" }
agents-store = { path = "crates/agents-store" }
agents-llm = { path = "crates/agents-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "macros"] }
tower-http = { version = "0.6", features = ["trace", "request-id"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
regex = "1"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"

# Lightweight is the point of this port: small, fast-starting binaries.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
