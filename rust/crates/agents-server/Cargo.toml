[package]
name = "agents-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agents-server"
path = "src/main.rs"

[dependencies]
agents-core.workspace = true
agents-contracts.workspace = true
agents-auth.workspace = true
agents-store.workspace = true
agents-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The streams: the wizard's answer and the database reads it starts with.
futures.workspace = true
# `ws` for the agent API's WebSocket (§3.6). The same crate, one more feature: `rust/Cargo.toml`
# is a protected path, so the feature is added on the crate that needs it.
axum = { workspace = true, features = ["ws"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true
chrono.workspace = true
# The chat calls the model over HTTP and reads the base64 header the old route read.
reqwest.workspace = true
base64.workspace = true
# The flow's state check compares in constant time.
subtle.workspace = true
# Not in [workspace.dependencies]: rust/Cargo.toml is a protected path. Approved for S2.
# Verifies the bcryptjs password hashes the TypeScript stored ($2a$/$2b$).
bcrypt = "0.17"
# Random bytes for the JWE IVs, PKCE, state and nonce; already built for sqlx.
getrandom = "0.2"

[dev-dependencies]
tower.workspace = true
http-body-util.workspace = true
agents-auth.workspace = true
# The stub identity provider signs its ID tokens with a test RSA key (PEM).
jsonwebtoken = "9.3"
sha2.workspace = true

[lints]
workspace = true
