[package]
name = "agents-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
# preserve_order: the SSE encoders must emit nested JSON objects (`toolCallId.input`,
# provider metadata) in insertion order, the way `JSON.stringify` does, or the bytes
# would not match the TypeScript frames; the default `BTreeMap` sorts keys.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true


[dev-dependencies]
toml.workspace = true

[lints]
workspace = true
